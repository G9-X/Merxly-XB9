name: Backend Deploy (Workshop Account)

on:
  push:
    branches: ["develop"]
    paths:
      - "merxly_backend/**"
      - "be/**"
      - ".github/workflows/backend-deploy-workshop.yml"
  pull_request:
    branches: ["develop"]
    paths:
      - "merxly_backend/**"
      - "be/**"
      - ".github/workflows/backend-deploy-workshop.yml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (default: latest)"
        required: false
        default: "latest"

env:
  AWS_REGION: ${{ vars.WORKSHOP_AWS_REGION }}
  AWS_ROLE_ARN: ${{ vars.WORKSHOP_AWS_ROLE_ARN }}
  ECS_CLUSTER_NAME: ${{ vars.WORKSHOP_ECS_CLUSTER_NAME }}
  ECS_SERVICE_NAME: ${{ vars.WORKSHOP_ECS_SERVICE_NAME }}
  ECS_TASK_FAMILY: ${{ vars.WORKSHOP_ECS_TASK_FAMILY }}
  ECR_REPOSITORY_NAME: ${{ vars.WORKSHOP_ECR_REPOSITORY_NAME }}
  BACKEND_CONTAINER_NAME: ${{ vars.WORKSHOP_BACKEND_CONTAINER_NAME }}
  WORKSHOP_RUN_DB_MIGRATION: ${{ vars.WORKSHOP_RUN_DB_MIGRATION }}
  BACKEND_DB_CONNECTION_STRING: ${{ secrets.WORKSHOP_BACKEND_DB_CONNECTION_STRING }}

permissions:
  contents: read
  id-token: write

concurrency:
  group: backend-workshop-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build + Deploy via GitHub Runner (OIDC)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect backend solution
        id: detect_backend
        run: |
          if [ -d "be" ]; then
            backend_dir="be"
          elif [ -d "merxly_backend" ]; then
            backend_dir="merxly_backend"
          else
            echo "Cannot find backend folder (be or merxly_backend)." >&2
            exit 1
          fi

          sln_path=$(find "$backend_dir" -maxdepth 2 -name "*.sln" | head -n 1)
          if [ -z "$sln_path" ]; then
            echo "Cannot find .sln under $backend_dir" >&2
            exit 1
          fi

          api_csproj="$backend_dir/merxly.API/merxly.API.csproj"
          infra_csproj="$backend_dir/merxly.Infrastructure/merxly.Infrastructure.csproj"
          if [ ! -f "$api_csproj" ] || [ ! -f "$infra_csproj" ]; then
            echo "Expected API/Infrastructure csproj not found under $backend_dir" >&2
            exit 1
          fi

          echo "backend_dir=$backend_dir" >> "$GITHUB_OUTPUT"
          echo "sln_path=$sln_path" >> "$GITHUB_OUTPUT"
          echo "api_csproj=$api_csproj" >> "$GITHUB_OUTPUT"
          echo "infra_csproj=$infra_csproj" >> "$GITHUB_OUTPUT"

      - name: Validate workshop configuration
        run: |
          set -e
          required=(
            AWS_REGION
            AWS_ROLE_ARN
            ECS_CLUSTER_NAME
            ECS_SERVICE_NAME
            ECS_TASK_FAMILY
            ECR_REPOSITORY_NAME
          )

          for s in "${required[@]}"; do
            if [ -z "${!s}" ]; then
              echo "Missing required variable/secret: $s" >&2
              exit 1
            fi
          done

          if [ -z "$BACKEND_CONTAINER_NAME" ]; then
            echo "BACKEND_CONTAINER_NAME not set, defaulting to 'backend'"
            echo "BACKEND_CONTAINER_NAME=backend" >> "$GITHUB_ENV"
          fi

          run_migration="${WORKSHOP_RUN_DB_MIGRATION:-false}"
          run_migration="${run_migration,,}"
          if [ "$run_migration" = "true" ] && [ -z "$BACKEND_DB_CONNECTION_STRING" ]; then
            echo "WORKSHOP_RUN_DB_MIGRATION=true but WORKSHOP_BACKEND_DB_CONNECTION_STRING is missing" >&2
            exit 1
          fi

          if [ "$run_migration" != "true" ]; then
            echo "WORKSHOP_RUN_DB_MIGRATION is not true, migration step will be skipped"
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore "${{ steps.detect_backend.outputs.sln_path }}"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: gha-backend-workshop
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify runner IAM role credentials
        run: |
          set -e
          aws sts get-caller-identity --region "$AWS_REGION"

      - name: Login to Amazon ECR
        id: login-ecr
        if: ${{ github.event_name != 'pull_request' }}
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build backend image (PR)
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          set -e
          docker build -t backend-pr:${GITHUB_SHA::12} "${{ steps.detect_backend.outputs.backend_dir }}"

      - name: Build and push backend image
        if: ${{ github.event_name != 'pull_request' }}
        id: image
        run: |
          set -e
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          REPOSITORY="$ECR_REPOSITORY_NAME"
          INPUT_TAG="${{ github.event.inputs.image_tag }}"

          if [ -z "$INPUT_TAG" ]; then
            INPUT_TAG="latest"
          fi

          IMAGE_SHA="$REGISTRY/$REPOSITORY:${GITHUB_SHA::12}"
          IMAGE_TAGGED="$REGISTRY/$REPOSITORY:$INPUT_TAG"

          docker build -t "$IMAGE_SHA" "${{ steps.detect_backend.outputs.backend_dir }}"
          docker tag "$IMAGE_SHA" "$IMAGE_TAGGED"

          docker push "$IMAGE_SHA"
          docker push "$IMAGE_TAGGED"

          echo "image_uri=$IMAGE_SHA" >> "$GITHUB_OUTPUT"

      - name: Run EF Core migration (MySQL)
        if: ${{ env.WORKSHOP_RUN_DB_MIGRATION == 'true' && github.event_name != 'pull_request' }}
        run: |
          set -e
          dotnet tool install --global dotnet-ef --version 8.*
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

          export ConnectionStrings__DefaultConnection="$BACKEND_DB_CONNECTION_STRING"

          dotnet ef database update \
            --project "${{ steps.detect_backend.outputs.infra_csproj }}" \
            --startup-project "${{ steps.detect_backend.outputs.api_csproj }}"

      - name: Register new ECS task definition revision
        if: ${{ github.event_name != 'pull_request' }}
        id: taskdef
        run: |
          set -e
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_FAMILY" \
            --query taskDefinition > taskdef.json

          jq --arg IMAGE "${{ steps.image.outputs.image_uri }}" --arg NAME "$BACKEND_CONTAINER_NAME" '
            {
              family,
              taskRoleArn,
              executionRoleArn,
              networkMode,
              containerDefinitions,
              volumes,
              placementConstraints,
              requiresCompatibilities,
              cpu,
              memory,
              runtimePlatform,
              proxyConfiguration,
              ipcMode,
              pidMode,
              inferenceAccelerators,
              ephemeralStorage
            }
            | .containerDefinitions = (.containerDefinitions | map(if .name == $NAME then .image = $IMAGE else . end))
            | with_entries(select(.value != null))
          ' taskdef.json > new-taskdef.json

          NEW_TASKDEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new-taskdef.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "taskdef_arn=$NEW_TASKDEF_ARN" >> "$GITHUB_OUTPUT"

      - name: Deploy to ECS service
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          set -e
          aws ecs update-service \
            --cluster "$ECS_CLUSTER_NAME" \
            --service "$ECS_SERVICE_NAME" \
            --task-definition "${{ steps.taskdef.outputs.taskdef_arn }}"

          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER_NAME" \
            --services "$ECS_SERVICE_NAME"

      - name: Summary
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          echo "## Backend Deploy Complete (Workshop)" >> "$GITHUB_STEP_SUMMARY"
          echo "| Item | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Region | $AWS_REGION |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Cluster | $ECS_CLUSTER_NAME |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Service | $ECS_SERVICE_NAME |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Task Family | $ECS_TASK_FAMILY |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Container | ${BACKEND_CONTAINER_NAME:-backend} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image | ${{ steps.image.outputs.image_uri }} |" >> "$GITHUB_STEP_SUMMARY"

      - name: PR Summary
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          echo "## Backend CI Complete (PR)" >> "$GITHUB_STEP_SUMMARY"
          echo "Build/restore/check completed for PR; deploy steps are intentionally skipped." >> "$GITHUB_STEP_SUMMARY"
